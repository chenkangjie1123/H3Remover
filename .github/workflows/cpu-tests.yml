name: Input and pipeline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy opencv-python-headless huggingface_hub
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s pipeline/tests -v
      - run: python infer.py --preview-only --video examples/street/source.mp4 --mask examples/street/mask.mp4 --output /tmp/mask-preview.mp4
